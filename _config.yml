# GitHub Pages (Jekyll) config.
# Keeps authoring-only files out of the published site.
# IMPORTANT: do NOT add a .nojekyll file — that disables Jekyll and these
# excludes stop working, exposing docs/ publicly.
exclude:
  - docs/
  - README.md
  - PLAN.md
  - note.md
  - cdp-editorial.html
  - _case-template.html
  - design_handoff_homepage_reveal/
  - check-tokens.sh
  - qa-artifacts/
  - real/

